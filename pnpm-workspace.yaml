packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

catalog:
  '@types/node': ^25.9.5
  '@typescript-eslint/eslint-plugin': ^8.65.0
  '@typescript-eslint/parser': ^8.65.0
  eslint: ^10.8.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-i18next: ^6.1.5
  eslint-plugin-prettier: ^5.5.6
  prettier: ^3.9.6
  typescript: 7.0.2
  '@vitest/coverage-v8': ^5.0.0
  vitest: ^5.0.0
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.10'
  - '@turbo/darwin-arm64@2.10.10'
  - '@turbo/linux-64@2.10.10'
  - '@turbo/linux-arm64@2.10.10'
  - '@turbo/windows-64@2.10.10'
  - '@turbo/windows-arm64@2.10.10'
  - turbo@2.10.10
overrides:
  '@grpc/grpc-js': '>=1.14.4'
  esbuild@>=0.17.0 <0.28.1: ^0.28.1
  glob: '>=10.5.0'
  hono@<4.13.5: ^4.13.5
  js-yaml@>=3.0.0 <3.15.2: ^5.0.0
  js-yaml@>=4.0.0 <4.3.2: ^5.0.0
  js-yaml@>=5.0.0 <=5.2.1: ^5.2.2
  linkify-it@<=5.0.1: ^6.0.0
  multer@<2.3.0: ^2.3.0
  nodemailer@<9.1.0: ^10.0.0
  nodemailer@<=9.0.0: '>=9.0.1'
  nodemailer@<=9.1.0: ^10.0.0
  nodemailer@>=6.9.16 <9.1.0: ^10.0.0
  qs@>=2.2.5 <6.16.0: ^6.16.0
  qs@>=6.14.2 <=6.15.3: ^6.16.0
  svgo@>=4.0.0 <4.1.0: ^4.1.0
  test-exclude: '>=8.0.0'
  uuid@<14.0.0: '>=14.0.0'
