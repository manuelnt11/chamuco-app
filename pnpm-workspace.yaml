packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

catalog:
  '@types/node': ^25.7.0
  '@typescript-eslint/eslint-plugin': ^8.59.3
  '@typescript-eslint/parser': ^8.59.3
  eslint: ^10.3.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-i18next: ^6.1.4
  eslint-plugin-prettier: ^5.5.5
  prettier: ^3.8.3
  typescript: ^6.0.3
