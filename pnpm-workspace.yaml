packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@firebase/util': true
  '@nestjs/core': true
  '@scarf/scarf': true
  '@swc/core': true
  esbuild: true
  msw: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

catalog:
  '@types/node': ^25.9.5
  '@typescript-eslint/eslint-plugin': ^8.65.0
  '@typescript-eslint/parser': ^8.65.0
  eslint: ^10.8.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-i18next: ^6.1.5
  eslint-plugin-prettier: ^5.5.6
  prettier: ^3.9.6
  typescript: ^6.0.3
  '@vitest/coverage-v8': ^4.1.10
  vitest: ^4.1.10
minimumReleaseAgeExclude:
  - '@xhmikosr/decompress@11.1.3'
  - brace-expansion@1.1.16 || 1.1.17 || 2.1.2 || 2.1.3 || 5.0.8
  - '@hono/node-server@2.0.5'
  - svgo@4.0.2
  - fast-uri@3.1.4
  - sharp@0.35.0
  - fast-xml-parser@5.10.1
  - next@16.2.11
  - postcss@8.5.18
  - linkify-it@5.0.1 || 5.0.2
  - js-yaml@5.2.2
overrides:
  '@grpc/grpc-js': '>=1.14.4'
  '@hono/node-server@<2.0.5': ^2.0.5
  ajv@>=7.0.0-alpha.0 <8.18.0: '>=8.18.0'
  axios@<1.15.0: '>=1.15.0'
  cross-spawn: '>=6.0.6'
  esbuild@>=0.17.0 <0.28.1: ^0.28.1
  fast-xml-parser@<5.7.0: '>=5.7.0'
  file-type@>=13.0.0 <21.3.1: '>=21.3.1'
  form-data@<2.5.6: '>=2.5.6 <5.0.0'
  form-data@>=4.0.0 <4.0.6: '>=4.0.6'
  glob: '>=10.5.0'
  hono: '>=4.12.21'
  js-yaml@>=5.0.0 <=5.2.1: ^5.2.2
  linkify-it@<=5.0.0: ^6.0.0
  linkify-it@<=5.0.1: ^6.0.0
  lodash: '>=4.18.0'
  multer: '>=2.2.0'
  nodemailer@<=9.0.0: '>=9.0.1'
  postcss@<8.5.10: '>=8.5.10'
  protobufjs@<7.6.1: '>=7.6.1 <9.0.0'
  qs@<6.14.1: '>=6.14.1'
  sharp@<0.35.0: ^0.35.0
  test-exclude: '>=8.0.0'
  tough-cookie@<4.1.3: '>=4.1.3'
  uuid@<14.0.0: '>=14.0.0'
