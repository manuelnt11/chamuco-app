name: API CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - '.github/workflows/api.yml'

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  ARTIFACT_REGISTRY: ${{ secrets.ARTIFACT_REGISTRY }}
  SERVICE_NAME: chamuco-api

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chamuco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies for vulnerabilities
        run: pnpm audit --audit-level high

      - name: Build workspace packages
        run: pnpm --filter @chamuco/shared-types --filter @chamuco/shared-utils build

      - name: Lint
        run: pnpm --filter api lint:check

      - name: Type check
        run: pnpm --filter api typecheck

      - name: Run unit tests with coverage
        run: pnpm --filter api test:cov

      - name: Apply database migrations (test DB)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chamuco_test
        run: pnpm --filter api db:migrate

      - name: Run integration (e2e) tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chamuco_test
          # A valid JSON string is required by env validation at AppModule init.
          # Firebase is fully mocked in e2e tests; this value is never used.
          FIREBASE_SERVICE_ACCOUNT_JSON: '{}'
          GOOGLE_CLOUD_STORAGE_BUCKET: test-bucket
        run: pnpm --filter api test:e2e

      - name: Build
        run: pnpm --filter api build

      - name: Upload coverage to GitHub
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-api
          path: apps/api/coverage/
          retention-days: 7

  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} \
            -t ${{ env.ARTIFACT_REGISTRY }}/api:latest \
            .

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/api:latest

      - name: Capture current revision (rollback target)
        run: |
          # Select the revision at 100% traffic explicitly rather than trusting
          # traffic[0] — that index isn't guaranteed to be the primary revision
          # if traffic is ever split (e.g. a manual canary/tag during an incident).
          # If no single revision holds 100%, leave this empty so the rollback
          # step below skips rather than guessing which one to restore.
          PREV=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format=json 2>/dev/null | jq -r '[.status.traffic[]? | select(.percent == 100)][0].revisionName // ""')
          echo "PREVIOUS_REVISION=$PREV" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          cat > /tmp/env-vars.yaml <<'EOF'
          NODE_ENV: production
          CORS_ORIGIN: "https://chamucotravel.com,https://www.chamucotravel.com"
          GITHUB_REPO_OWNER: manuelnt11
          GITHUB_REPO_NAME: chamuco-app
          GITHUB_PROJECT_NUMBER: "4"
          EOF
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.ARTIFACT_REGISTRY }}/api:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --platform=managed \
            --service-account=chamuco-api-sa@chamuco-app-mn.iam.gserviceaccount.com \
            --add-cloudsql-instances=chamuco-app-mn:us-central1:chamuco-postgres \
            --vpc-connector=chamuco-vpc-connector \
            --vpc-egress=private-ranges-only \
            --env-vars-file=/tmp/env-vars.yaml \
            --set-secrets=FIREBASE_SERVICE_ACCOUNT_JSON=FIREBASE_SERVICE_ACCOUNT_JSON:latest,GEONAMES_USERNAME=GEONAMES_USERNAME:latest,GITHUB_TOKEN=GITHUB_TOKEN:latest,GOOGLE_CLOUD_STORAGE_BUCKET=GOOGLE_CLOUD_STORAGE_BUCKET:latest,SMTP_HOST=SMTP_HOST:latest,SMTP_PORT=SMTP_PORT:latest,SMTP_USER=SMTP_USER:latest,SMTP_PASS=SMTP_PASS:latest,SMTP_FROM=SMTP_FROM:latest,FRONTEND_URL=FRONTEND_URL:latest \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=10 \
            --timeout=300 \
            --execution-environment=gen2 \
            --no-use-http2 \
            --allow-unauthenticated \
            --quiet

      - name: Verify deployment
        run: |
          # Get service URL
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --format='value(status.url)')

          echo "Service URL: $SERVICE_URL"

          # Test health endpoint — retry before failing. A single transient blip here
          # now triggers a real traffic rollback (see below), so don't act on one bad
          # curl against an otherwise-healthy deploy.
          for i in $(seq 1 5); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" $SERVICE_URL/health)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed (HTTP $HTTP_CODE)"
              break
            fi
            echo "⏳ Attempt $i/5 got HTTP $HTTP_CODE, retrying in 5s..."
            sleep 5
          done

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Health check failed after 5 attempts (HTTP $HTTP_CODE)"
            exit 1
          fi

      - name: Rollback to previous revision
        if: failure()
        run: |
          if [ -z "${{ env.PREVIOUS_REVISION }}" ]; then
            echo "⚠️ No previous revision recorded — nothing to roll back to (likely first-ever deploy)."
            exit 0
          fi
          echo "🔙 Rolling back traffic to ${{ env.PREVIOUS_REVISION }}..."
          gcloud run services update-traffic ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} \
            --to-revisions=${{ env.PREVIOUS_REVISION }}=100
          echo "✅ Traffic restored to ${{ env.PREVIOUS_REVISION }}. This workflow run still fails so the bad image gets flagged."
